[general]
import = ["tokyo-dark.toml"]

[window]
decorations = "None"
opacity = 0.5
padding = { x = 10, y = 10 }

[font]
normal = { family = "Monofur Nerd Font", style = "Regular" }
bold = { family = "Monofur Nerd Font", style = "Bold" }
italic = { family = "Monofur Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Beam", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "Off" }
